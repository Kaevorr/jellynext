name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Jellyfin.Plugin.JellyNext.sln --configuration Release

      - name: Package plugin
        id: package
        run: |
          python3 .github/scripts/package-plugin.py dist --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_SHA"
          jq -r '"version=" + .[0].versions[0].version' dist/manifest.json >> "$GITHUB_OUTPUT"
          jq -r '.[0].versions[0].changelog' dist/manifest.json > dist/release-notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellynext-v${{ steps.package.outputs.version }}
          path: |
            dist/*.zip
            dist/manifest.json

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: JellyNext ${{ steps.package.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/*.zip
            dist/manifest.json
          fail_on_unmatched_files: true
